name: CI - Versao semantica
description: Release semantica com CHANGELOG e publicacao no GitHub

inputs:
  github_token:
    description: Token do GitHub
    required: true

runs:
  using: composite
  steps:
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Instalar release semantica
      shell: bash
      run: |
        npm install --no-save \
          semantic-release@24 \
          @semantic-release/commit-analyzer@13 \
          @semantic-release/release-notes-generator@14 \
          @semantic-release/changelog@6 \
          @semantic-release/git@10 \
          @semantic-release/exec@6 \
          @semantic-release/github@11 \
          conventional-changelog-conventionalcommits@8 \
          conventional-changelog-writer@8
    - name: Executar release semantica
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        npx --no-install semantic-release --extends ./linters/releaserc.json
